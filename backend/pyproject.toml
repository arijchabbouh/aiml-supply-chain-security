[project]
name = "ai-ml-security-platform"
version = "0.1.0"
description = "AI/ML Supply Chain Security & Risk Assessment Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pgvector",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

[tool.ruff]
line-length = 100
